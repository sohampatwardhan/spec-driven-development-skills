name: Tests

on:
  push:

jobs:
  spec-driven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 -m pytest tests/ -q
        working-directory: spec-driven
